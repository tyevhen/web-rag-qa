services:
  - type: web
    name: web-rag-qa-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_BASE_URL     # a hosted OpenAI-compatible endpoint; Render can't reach a local Ollama
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: SYSTEM_PROMPT
        sync: false
      - key: INGEST_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel UI URL once deployed
