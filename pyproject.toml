[project]
name = "web-rag-qa"
version = "0.1.0"
description = "Boilerplate agentic RAG system: scrape any website, embed content, answer questions over it."
requires-python = ">=3.13, <3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "crawl4ai>=0.8.6",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langchain-openai>=1.2.0",
    "langdetect>=1.0.9",
    "langgraph>=1.1.9",
    "numpy>=2.4.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "streamlit>=1.56.0",
    "structlog>=25.5.0",
    "arq>=0.26.1",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.46.0",
    "pgvector>=0.3.6",
]

[tool.pyright]
typeCheckingMode = "basic"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.2",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
